name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  app:
    name: App Packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --filter '*' build

      - name: Test
        run: bun run --filter '*' test

      - name: Format check
        run: bun run --filter 'circle' fmt -- --check

  relay:
    name: Relay CRE
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/apps/submit-bid
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: app

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Install CRE CLI
        run: curl -sSL https://cre.chain.link/install.sh | bash

      - name: Compile workflow
        run: |
          export PATH="$HOME/.cre/bin:$PATH"
          cd ../..
          cre workflow build apps/submit-bid --target staging-settings
